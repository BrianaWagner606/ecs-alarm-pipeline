name: terraform-apply
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
      steps:
      - uses: actions/checkout@v4
      - name: Debug OIDC token
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | cut -d'.' -f2 | base64 -d 2>/dev/null | python3 -m json.tool
      - uses: aws-actions/configure-aws-credentials@v4